[theme]
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"

[server]
headless = true
address = "127.0.0.1"   # sólo localhost (entorno corporativo). El lanzador lo puede cambiar con --lan
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # oculta "Deploy" y opciones de desarrollador
